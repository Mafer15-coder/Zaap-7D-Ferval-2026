
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Navidad | ZAAP-7D | Ferval</title>

<style>
body {
    margin: 0;
    background: #03152d;
    font-family: Georgia, serif;
}

.tarjeta {
    position: relative;
    max-width: 650px;
    margin: auto;
}

.tarjeta img {
    width: 100%;
    height: auto;
    display: block;
}

.reproductor {
    position: absolute;
    left: 34%;
    top: 83%;
    width: 54%;
    height: 7%;
    background: transparent;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.reproductor.activo {
    animation: brillo 2s infinite alternate;
}

@keyframes brillo {
    from {
        box-shadow: 0 0 8px 2px #ffd700;
    }
    to {
        box-shadow: 0 0 20px 5px #ffd700;
    }
}

.creditos {
    text-align: center;
    color: #e7cb85;
    font-size: 12px;
    padding: 12px;
}
</style>
</head>

<body>

<main class="tarjeta">

    <img src="zaap-7d-azul.png"
         alt="Feliz Navidad ZAAP-7D | Ferval">

    <button id="boton"
            class="reproductor"
            aria-label="Reproducir música"
            onclick="reproducir()">
    </button>

</main>

<audio id="musica" loop preload="none">
    <source src="navidad-musica.ogg" type="audio/ogg">
</audio>

<footer class="creditos">
    Música: Jason Shaw / Audionautix
</footer>

<script>
const musica = document.getElementById("musica");
const boton = document.getElementById("boton");

async function reproducir() {
    if (musica.paused) {
        try {
            await musica.play();
            boton.classList.add("activo");
            boton.setAttribute("aria-label", "Pausar música");
        } catch (error) {
            alert("No se pudo reproducir la música.");
        }
    } else {
        musica.pause();
        boton.classList.remove("activo");
        boton.setAttribute("aria-label", "Reproducir música");
    }
}
</script>

</body>
</html>
